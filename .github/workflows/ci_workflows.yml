name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2

  tests:
    name: ${{ matrix.name }} [ ${{ matrix.os }} ]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
        python: ['3.x']
        toxenv: [test]
        toxargs: [-v]

        include:

          - name: Test with oldest supported versions of our dependencies
            os: ubuntu-22.04
            python: '3.10'
            toxenv: test-oldestdeps
            toxargs: -v

          - name: Test with development versions of our dependencies
            os: ubuntu-latest
            python: '3.x'
            toxenv: test-devdeps
            toxargs: -v

          - name: Documentation build
            os: ubuntu-22.04
            python: '3.10'
            toxenv: build_docs
            toxargs: -v
            apt_packages: graphviz

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        submodules: true
        persist-credentials: false
    - name: Fetch tags from upstream
      # setuptools_scm needs the release tags to compute the version; forks
      # don't carry tags added to liberfa/pyerfa after they were created.
      run: git fetch --tags --no-recurse-submodules https://github.com/liberfa/pyerfa.git
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python }}
        allow-prereleases: true
    - name: Install APT packages
      if: matrix.apt_packages
      run: sudo apt-get install ${{ matrix.apt_packages }}
    - name: Install packages for macOS
      if: matrix.os == 'macos-latest'
      run: brew install autoconf automake
    - name: Install Python dependencies
      run: python -m pip install --upgrade tox
    - name: Run tests
      run: |
        pip freeze
        tox ${{ matrix.toxargs }} -e ${{ matrix.toxenv }} -- ${{ matrix.toxposargs }}

  tests_external_liberfa:
    # Note: this does not use tox, an advantage of which is that it runs doctests
    # on all files in the repository, including README.rst.
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      PYERFA_USE_SYSTEM_LIBERFA: 1
    strategy:
      fail-fast: true
      matrix:
        include:

          - name: Tests with external liberfa
            os: ubuntu-latest
            toxenv: test
            toxargs: -v
            apt_packages: python3-venv python3-pip liberfa-dev

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        submodules: true
        persist-credentials: false
    - name: Fetch tags from upstream
      # setuptools_scm needs the release tags to compute the version; forks
      # don't carry tags added to liberfa/pyerfa after they were created.
      run: git fetch --tags --no-recurse-submodules https://github.com/liberfa/pyerfa.git
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
    - name: Install APT packages
      if: matrix.apt_packages
      run: sudo apt-get install ${{ matrix.apt_packages }}
    - name: Run tests
      run: |
        python -m venv --system-site-packages tests
        source tests/bin/activate
        python -m pip install --editable .[test]
        (nm -u erfa/ufunc.*.so | grep eraA2af) || exit 1
        (python -c 'import erfa' 2>&1 | grep -n 'too old') > /dev/null && (echo 'liberfa too old, skipping tests'; exit 0) || python -m pytest
