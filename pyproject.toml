[build-system]
requires = [
    "setuptools>=77.0.0",
    "setuptools_scm>=8.0.0",
    "numpy>=2.0.0",
]
build-backend = 'setuptools.build_meta'

[project]
name = "pyerfa"
authors = [{name = "The PyERFA Developers"}]
license = "BSD-3-Clause"
license-files = ["LICENSE.rst"]
description = "Python bindings for ERFA"
readme = "README.rst"
keywords = ["astronomy", "astrophysics", "cosmology", "space", "science", "coordinate"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
urls = {Homepage = "https://github.com/liberfa/pyerfa"}
requires-python = ">=3.10"
dependencies = ["numpy>=2.0.0"]
dynamic = ["version"]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-doctestplus>=0.7",
]
docs = ["sphinx-astropy>=1.3"]

[dependency-groups]
typing = [
    "mypy>=1.20.1",
    "setuptools-scm>=8.0.0",
    "types-setuptools>=82.0.0.20260518",
    # Older vcs-versioning versions lack the py.typed marker file
    # (accidentally), but it is not needed at all with setuptools-scm < 10.
    "vcs-versioning>=2.0.1; 'setuptools-scm'>='10'",
]

[tool.setuptools]
# We set packages to find: to automatically find all sub-packages
zip-safe = false
include-package-data = false

[tool.setuptools.packages.find]
namespaces = false

[tool.setuptools_scm]
version_file = "erfa/_version.py"

[tool.pytest.ini_options]
minversion = "4.6"
testpaths = ["erfa", "docs", "README.rst"]
doctest_plus = "enabled"
doctest_optionflags = """
NORMALIZE_WHITESPACE
ELLIPSIS
FLOAT_CMP
IGNORE_EXCEPTION_DETAIL"""
text_file_format = "rst"
addopts = "--doctest-rst"
xfail_strict = true

[tool.cibuildwheel]
enable = ["pypy"]
skip = [
    "cp314t-*",
    "cp310-win_arm64",
]

[tool.ruff.lint]
extend-select = [
    "ARG",
    "ERA",
    "I",
    "PGH",
    "PLC",
    "PLE",
    "PT",
    "PTH",
    "RET",
    "RUF",
    "S101",
    "SIM",
    "UP",
]
ignore = [
    "BLE001",  # temporary
    "DTZ",  # temporary
    "S110",  # temporary
]
[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = [
    "F401",  # unused-import
]
"test_*.py" = ["S101"]

[tool.mypy]
files = [
    "erfa_generator.py",
    "setup.py",
    "erfa/tests/test_ufunc.py"
]

[tool.uv]
prerelease = "allow"
# Some dependencies don't yet publish riscv64 wheels to PyPI; fall back to
# RISE's index, which does, instead of building from sdist.
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "riseproject"
url = "https://pypi.riseproject.dev/simple/"
